<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breadboard Battler</title>
<style>
:root{--bg:#0c1117;--panel:#151c25;--line:#2d3947;--text:#eef4f8;--muted:#93a4b5;--green:#58d6a4;--yellow:#f5c85b;--board:#d8d1bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
#app{max-width:430px;margin:auto;padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-weight:900}.ver{font-size:11px;color:var(--muted)}.credits{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.battle{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.battle b{font-size:12px}.vs{font-size:10px;color:var(--muted);font-weight:900}.bar{height:8px;background:#26313e;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#77d39b;width:100%;transition:.12s}.enemy .fill{background:#e98282}.mini{font-size:10px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{background:#1c2632;border-radius:9px;padding:7px 2px;text-align:center}.stat strong{display:block;font-size:13px}.stat span{font-size:9px;color:var(--muted)}
.tools,.palette{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar,.palette::-webkit-scrollbar{display:none}.tool{flex:0 0 auto;min-height:38px;border:1px solid var(--line);border-radius:10px;background:#1c2632;padding:0 10px;font-size:12px;font-weight:800}.tool.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.tool.reco{background:#173c32;border-color:#286c59}
.board{position:relative;width:min(100%,340px);aspect-ratio:10/12;margin:auto;background:var(--board);border:5px solid #bcb49f;border-radius:15px;overflow:hidden}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(12,1fr)}.cell{position:relative;border-right:1px solid rgba(80,70,55,.08);border-bottom:1px solid rgba(80,70,55,.08)}.cell:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#746e5e;opacity:.55;left:50%;top:50%;transform:translate(-50%,-50%)}.cell:nth-child(10n+5){border-right:4px solid #b9b09c}
#wires{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.wire{fill:none;stroke:#f4c94f;stroke-width:2.2}.parts{position:absolute;inset:0;z-index:3;pointer-events:none}.part{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#10151a;font-size:10px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.3);pointer-events:auto}.part small{display:block;font-size:8px}.part.hot{box-shadow:0 0 0 2px #4ad19d,0 0 12px #4ad19d88}.part.sel{outline:3px solid white}.core{background:#65d9ac}.resistor{background:#e8c46a}.cap{background:#78bdf2}.battery{background:#aeb7c1}.gun{background:#ff9c66}.pulse{background:#c8a0f5}.repair{background:#8ddd9a}
.hint{font-size:11px;color:var(--muted);line-height:1.4;min-height:32px;margin:7px 1px}.hint b{color:var(--text)}
.piece{flex:0 0 104px;min-height:76px;border:1px solid var(--line);border-radius:11px;background:#1c2632;text-align:left;padding:8px}.piece.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.piece:disabled{opacity:.35}.piece b{display:block;font-size:12px}.piece span{display:block;font-size:9px;color:var(--muted);margin-top:4px}.piece em{display:block;font-style:normal;font-size:10px;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.action{min-height:46px;border:0;border-radius:12px;background:#263342;font-weight:900}.action.go{background:#1f7059}.action:disabled{opacity:.45}
.modal{position:fixed;inset:0;background:#05080cc9;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modal.show{display:flex}.sheet{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.sheet h2{margin:0 0 4px;font-size:17px}.sheet p{font-size:11px;color:var(--muted)}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.offer{min-height:105px;border:1px solid var(--line);background:#1c2632;border-radius:11px;padding:9px;text-align:left}.offer b,.offer span,.offer em{display:block}.offer b{font-size:11px}.offer span{font-size:9px;color:var(--muted);margin-top:4px}.offer em{font-size:11px;font-style:normal;color:#f2d27c;margin-top:9px}.offer:disabled{opacity:.35}.next{width:100%;margin-top:9px;min-height:44px;border:0;border-radius:11px;background:#1f7059;font-weight:900}
</style>
</head>
<body>
<div id="app">
<header><div><div class="title">Breadboard Battler</div><div class="ver">TEST v0.0.1-test1 · breadboard UI prototype</div></div><div class="credits">CR <b id="credits">100</b></div></header>

<div class="card battle">
  <div><b>CORE · S<span id="stage">1</span></b><div class="bar"><div class="fill" id="pbar"></div></div><div class="mini">HP <span id="php">100</span> · 회복 <span id="heal">0</span>/s</div></div>
  <div class="vs">AUTO<br>VS</div>
  <div class="enemy"><b>SCRAP DRONE</b><div class="bar"><div class="fill" id="ebar"></div></div><div class="mini">HP <span id="ehp">180</span> · 재생 1.2/s</div></div>
</div>

<div class="card"><div class="stats">
<div class="stat"><strong>12V</strong><span>BUS</span></div>
<div class="stat"><strong id="amps">0/2.5A</strong><span>전류</span></div>
<div class="stat"><strong id="dps">0</strong><span>DPS</span></div>
<div class="stat"><strong id="space">3%</strong><span>공간</span></div>
</div></div>

<div class="card" style="padding:8px"><div class="tools">
<button class="tool reco" id="reco">추천 배치</button>
<button class="tool" id="wire">배선</button>
<button class="tool" id="rotate">회전</button>
<button class="tool" id="erase">지우기</button>
<button class="tool" id="reset">초기화</button>
</div></div>

<div class="board" id="board">
<svg id="wires" viewBox="0 0 1000 1200" preserveAspectRatio="none"><g id="wireLayer"></g></svg>
<div class="grid" id="grid"></div><div class="parts" id="parts"></div>
</div>
<div class="hint" id="hint"><b>추천 배치</b>로 시작하거나 아래 부품을 골라 빈 칸을 탭하세요.</div>

<div class="card">
<div class="palette" id="palette"></div>
<div class="actions"><button class="action" id="check">회로 검사</button><button class="action go" id="fight">전투 시작</button></div>
</div>
</div>

<div class="modal" id="modal"><div class="sheet"><h2>STAGE CLEAR</h2><p>보상으로 부품을 구매하고 다음 전투 전에 빵판을 다시 구성하세요.</p><div class="shop" id="shop"></div><button class="next" id="next">다음 스테이지</button></div></div>

<script>
(function(){
var C=10,R=12,nextId=1;
var defs={
 resistor:{n:'저항',s:'R',w:2,h:1,d:'전압을 낮춤'},
 cap:{n:'캐패시터',s:'CAP',w:1,h:2,d:'펄스포 순간전류'},
 battery:{n:'배터리',s:'BAT',w:2,h:2,d:'공급 +0.8A'},
 gun:{n:'기관포',s:'GUN',w:2,h:2,d:'0.8A 지속딜'},
 pulse:{n:'펄스포',s:'PULSE',w:3,h:2,d:'CAP 필요'},
 repair:{n:'수리기',s:'FIX',w:2,h:2,d:'0.7A 회복'}
};
var st={mode:'place',sel:null,rot:0,first:null,parts:[],wires:[],credits:100,stage:1,busy:false,inv:{resistor:3,cap:2,battery:1,gun:2,pulse:1,repair:1}};
function q(x){return document.querySelector(x)}
for(var i=0;i<C*R;i++){var c=document.createElement('div');c.className='cell';c.dataset.x=i%C;c.dataset.y=Math.floor(i/C);q('#grid').appendChild(c)}
function dm(t,r){var d=defs[t];return r?{w:d.h,h:d.w}:{w:d.w,h:d.h}}
function hit(p,x,y){var d=dm(p.t,p.r);return x>=p.x&&x<p.x+d.w&&y>=p.y&&y<p.y+d.h}
function can(t,x,y,r){var d=dm(t,r);if(x<0||y<0||x+d.w>C||y+d.h>R)return false;for(var i=0;i<st.parts.length;i++)for(var yy=y;yy<y+d.h;yy++)for(var xx=x;xx<x+d.w;xx++)if(hit(st.parts[i],xx,yy))return false;return true}
function add(t,x,y,r){if(!can(t,x,y,r)||!st.inv[t])return false;st.inv[t]--;st.parts.push({id:nextId++,t:t,x:x,y:y,r:r});draw();return true}
function center(p){var d=p.t==='core'?{w:2,h:2}:dm(p.t,p.r);return{x:(p.x+d.w/2)*100,y:(p.y+d.h/2)*100}}
function reach(){var core=st.parts[0],seen={};seen[core.id]=1;var change=true;while(change){change=false;for(var i=0;i<st.wires.length;i++){var w=st.wires[i];if(seen[w.a]&&!seen[w.b]){seen[w.b]=1;change=true}}}return seen}
function ancestor(id,type){var todo=[id],seen={};while(todo.length){var n=todo.pop();if(seen[n])continue;seen[n]=1;var p=st.parts.find(function(x){return x.id===n});if(p&&p.t===type&&n!==id)return true;for(var i=0;i<st.wires.length;i++)if(st.wires[i].b===n)todo.push(st.wires[i].a)}return false}
function calc(){var r=reach(),supply=2.5,need=0,dps=0,heal=0,warn=[];st.parts.forEach(function(p){if(r[p.id]&&p.t==='battery')supply+=.8});st.parts.forEach(function(p){if(!r[p.id])return;if(p.t==='gun'){need+=.8;dps+=10}if(p.t==='repair'){need+=.7;heal+=3}if(p.t==='pulse'){need+=1.2;if(ancestor(p.id,'cap'))dps+=18;else warn.push('펄스포 앞에 캐패시터가 필요합니다')}});var f=need?Math.min(1,supply/need):1;if(need>supply)warn.push('공급전류가 부족합니다');return{r:r,s:supply,n:need,d:dps*f,h:heal*f,w:warn,f:f}}
function draw(){
 var ev=calc(),pl=q('#parts');pl.innerHTML='';
 st.parts.forEach(function(p){var d=p.t==='core'?{w:2,h:2}:dm(p.t,p.r),b=document.createElement('button');b.type='button';b.className='part '+p.t+(ev.r[p.id]?' hot':'');if(st.first===p.id)b.className+=' sel';b.style.left=(p.x*10)+'%';b.style.top=(p.y*100/R)+'%';b.style.width=(d.w*10)+'%';b.style.height=(d.h*100/R)+'%';b.innerHTML=p.t==='core'?'CORE<small>12V 2.5A</small>':defs[p.t].s+'<small>'+defs[p.t].n+'</small>';b.onclick=function(e){e.stopPropagation();tapPart(p)};pl.appendChild(b)});
 var wl=q('#wireLayer');wl.innerHTML='';st.wires.forEach(function(w){var a=st.parts.find(function(p){return p.id===w.a}),b=st.parts.find(function(p){return p.id===w.b});if(!a||!b)return;var A=center(a),B=center(b),m=(A.x+B.x)/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','wire');p.setAttribute('d','M '+A.x+' '+A.y+' L '+m+' '+A.y+' L '+m+' '+B.y+' L '+B.x+' '+B.y);wl.appendChild(p)});
 q('#amps').textContent=ev.n.toFixed(1)+'/'+ev.s.toFixed(1)+'A';q('#dps').textContent=ev.d.toFixed(0);q('#heal').textContent=ev.h.toFixed(1);var used=0;st.parts.forEach(function(p){var d=p.t==='core'?{w:2,h:2}:dm(p.t,p.r);used+=d.w*d.h});q('#space').textContent=Math.round(used/C/R*100)+'%';q('#fight').disabled=st.busy||ev.d<=0;
 palette();q('#wire').classList.toggle('on',st.mode==='wire');q('#erase').classList.toggle('on',st.mode==='erase');q('#rotate').classList.toggle('on',st.rot===1)
}
function palette(){var p=q('#palette');p.innerHTML='';Object.keys(defs).forEach(function(t){var d=defs[t],b=document.createElement('button');b.type='button';b.className='piece'+(st.sel===t?' on':'');b.disabled=st.busy||!st.inv[t];b.innerHTML='<b>'+d.n+'</b><span>'+d.d+'</span><em>보유 ×'+st.inv[t]+' · '+d.w+'×'+d.h+'</em>';b.onclick=function(){st.mode='place';st.sel=t;st.first=null;q('#hint').innerHTML='<b>'+d.n+'</b> 선택됨. 빈 칸을 탭하세요.';draw()};p.appendChild(b)})}
function tapPart(p){if(st.busy||p.t==='core'&&st.mode==='erase')return;if(st.mode==='erase'){st.inv[p.t]++;st.parts=st.parts.filter(function(x){return x.id!==p.id});st.wires=st.wires.filter(function(w){return w.a!==p.id&&w.b!==p.id});draw();return}if(st.mode==='wire'){if(!st.first){st.first=p.id;q('#hint').innerHTML='<b>시작점 선택.</b> 다음 부품을 탭하세요.'}else if(st.first===p.id){st.first=null}else{if(!st.wires.some(function(w){return w.a===st.first&&w.b===p.id}))st.wires.push({a:st.first,b:p.id});st.first=null;q('#hint').textContent='연결 완료.'}draw()}}
q('#grid').onclick=function(e){if(st.busy||st.mode!=='place'||!st.sel)return;var c=e.target.closest('.cell');if(c&&!add(st.sel,+c.dataset.x,+c.dataset.y,st.rot))q('#hint').textContent='그 자리에는 들어가지 않습니다.'};
q('#wire').onclick=function(){st.mode=st.mode==='wire'?'place':'wire';st.sel=null;st.first=null;q('#hint').textContent=st.mode==='wire'?'배선: 시작 부품 → 다음 부품 순서로 탭하세요.':'배선 모드 종료.';draw()};
q('#erase').onclick=function(){st.mode=st.mode==='erase'?'place':'erase';st.sel=null;st.first=null;q('#hint').textContent=st.mode==='erase'?'지울 부품을 탭하세요.':'지우기 종료.';draw()};
q('#rotate').onclick=function(){st.rot=st.rot?0:1;draw()};
function clear(){st.parts.slice(1).forEach(function(p){st.inv[p.t]++});st.parts=st.parts.slice(0,1);st.wires=[];st.first=null;st.sel=null}
q('#reset').onclick=function(){clear();draw();q('#hint').textContent='초기화됨.'};
q('#reco').onclick=function(){clear();var need={resistor:1,gun:1,cap:1,pulse:1,repair:1};for(var k in need)if(st.inv[k]<need[k])return;add('resistor',2,9,0);add('gun',5,9,0);add('cap',2,4,0);add('pulse',5,4,0);add('repair',7,7,0);var core=st.parts[0],r=st.parts.find(function(x){return x.t==='resistor'}),g=st.parts.find(function(x){return x.t==='gun'}),c=st.parts.find(function(x){return x.t==='cap'}),p=st.parts.find(function(x){return x.t==='pulse'}),f=st.parts.find(function(x){return x.t==='repair'});st.wires=[{a:core.id,b:r.id},{a:r.id,b:g.id},{a:core.id,b:c.id},{a:c.id,b:p.id},{a:core.id,b:f.id}];q('#hint').innerHTML='<b>추천 회로.</b> 같은 연결을 유지한 채 더 작게 접어 넣어보세요.';draw()};
q('#check').onclick=function(){var ev=calc();q('#hint').innerHTML=ev.w.length?'<b>경고:</b> '+ev.w[0]:'<b>정상:</b> '+ev.d.toFixed(0)+' DPS · 회복 '+ev.h.toFixed(1)+'/s'};
q('#fight').onclick=function(){var ev=calc();if(st.busy||ev.d<=0)return;st.busy=true;draw();var ph=100,eh=180+(st.stage-1)*45,max=eh,t=0;var timer=setInterval(function(){var x=calc();eh-=(x.d-1.2)*.1;ph-=(7+(st.stage-1))*.1;ph+=x.h*.1;ph=Math.min(100,ph);t+=.1;q('#pbar').style.width=Math.max(0,ph)+'%';q('#ebar').style.width=Math.max(0,eh/max*100)+'%';q('#php').textContent=Math.max(0,Math.ceil(ph));q('#ehp').textContent=Math.max(0,Math.ceil(eh));if(eh<=0||ph<=0||t>35){clearInterval(timer);st.busy=false;if(eh<=0){st.credits+=60;q('#credits').textContent=st.credits;q('#modal').classList.add('show');shop()}else q('#hint').innerHTML='<b>패배.</b> 공격/회복 배분을 바꿔보세요.';draw()}},100)};
function shop(){var box=q('#shop'),o=[['cap','CAP +1',35],['battery','배터리 +1',45],['pulse','펄스포 +1',70]];box.innerHTML='';o.forEach(function(a){var b=document.createElement('button');b.className='offer';b.disabled=st.credits<a[2];b.innerHTML='<b>'+a[1]+'</b><span>다음 빌드 선택지 확장</span><em>'+a[2]+' CR</em>';b.onclick=function(){if(st.credits<a[2])return;st.credits-=a[2];st.inv[a[0]]++;q('#credits').textContent=st.credits;b.disabled=true;b.innerHTML+='<span>구매 완료</span>';palette()};box.appendChild(b)})}
q('#next').onclick=function(){st.stage++;q('#stage').textContent=st.stage;q('#ehp').textContent=180+(st.stage-1)*45;q('#php').textContent=100;q('#pbar').style.width='100%';q('#ebar').style.width='100%';q('#modal').classList.remove('show');q('#hint').innerHTML='<b>Stage '+st.stage+'.</b> 빵판을 다시 손봐도 됩니다.'};
st.parts=[{id:nextId++,t:'core',x:0,y:9,r:0}];draw();
})();
</script>
</body>
</html>
